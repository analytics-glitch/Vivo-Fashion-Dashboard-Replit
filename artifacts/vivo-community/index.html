<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Vivo Johari</title>
    <meta name="description" content="Vivo Johari — we shine together. Earn points, join style challenges and shop the latest Vivo drops." />
    <meta name="theme-color" content="#fbf9f6" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Vivo Johari" />
    <meta property="og:description" content="Vivo Johari — points, style challenges and first looks from Vivo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vivo Johari" />
    <meta name="twitter:description" content="Vivo Johari — points, style challenges and first looks from Vivo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable app. Bubblewrap generates the whole Android project from
         this manifest, so it is a prerequisite for the store build, not a
         nicety. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Johari" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered after load so it never competes with the first paint.
      // Failure is silent on purpose: no service worker is a slightly less
      // capable app, not a broken one.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
