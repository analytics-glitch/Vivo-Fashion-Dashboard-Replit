kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/fabric", "/clienteling", "/reconcile", "/tiktokecdOdOLGOstI9a9rEZzScUsE7H5MF9fz.txt", "/tiktokk6FXJJjsKxj6c7S5DGT00YAaX5CstwWr.txt"]

[services.env]
PORT = "8080"

[services.development]
run = "python3 /home/runner/workspace/run_api.py"

[services.production]

[services.production.build]
args = ["python3", "--version"]

# Production runs the self-healing supervisor (watchdog), which spawns and keeps
# alive both uvicorn (the API on PORT) and the incremental sync loop. Requires a
# Reserved VM deployment target so the background loop is never scaled to zero.
[services.production.run]
args = ["python3", "/home/runner/workspace/watchdog.py"]

[services.production.run.env]
PORT = "8080"
WATCHDOG_MANAGE_API = "1"

# Readiness gate for promotion: /api/readyz returns 200 only when the DB is
# reachable (503 otherwise), so a new build is promoted only once it can actually
# serve. /api/healthz (DB-free liveness) stays available for plain up/down checks.
[services.production.health.startup]
path = "/api/readyz"

# ── Vivo Loyalty PWA (standalone Shopify-connected loyalty app) ──────────────
# Vendored AS-IS at repo-root loyalty-app/ (npm, Fastify + Prisma + React Router
# SPA). Own process, own port, own Postgres schema (loyalty_app). Served under
# the /loyalty-app base path — SPA, API, and Shopify webhooks are all same-origin.
[[services]]
localPort = 8090
name = "Vivo Loyalty PWA"
paths = ["/loyalty-app"]

[services.env]
PORT = "8090"
LOYALTY_APP_SERVE_FRONTEND = "true"

[services.development]
run = "sh -c 'cd /home/runner/workspace/loyalty-app/loyalty-app-backend && npm ci && npx tsx src/server.ts'"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/loyalty-app && (cd loyalty-app-backend && npm ci && npx prisma generate && node scripts/db-env.mjs npx prisma migrate deploy) && (cd the-loyalty-app && npm ci && npm run build)"]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/loyalty-app/loyalty-app-backend && npm ci && npx tsx src/server.ts"]

[services.production.run.env]
PORT = "8090"
LOYALTY_APP_SERVE_FRONTEND = "true"

[services.production.health.startup]
path = "/loyalty-app/health"
