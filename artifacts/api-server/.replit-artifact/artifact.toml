kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/fabric", "/clienteling"]

[services.env]
PORT = "8080"

[services.development]
run = "python3 -m uvicorn api_pg:app --app-dir /home/runner/workspace --host 0.0.0.0 --port 8080"

[services.production]

[services.production.build]
args = ["python3", "--version"]

# Production runs the self-healing supervisor (watchdog), which spawns and keeps
# alive both uvicorn (the API on PORT) and the incremental sync loop. Requires a
# Reserved VM deployment target so the background loop is never scaled to zero.
[services.production.run]
args = ["python3", "/home/runner/workspace/watchdog.py"]

[services.production.run.env]
PORT = "8080"
WATCHDOG_MANAGE_API = "1"

# Readiness gate for promotion: /api/readyz returns 200 only when the DB is
# reachable (503 otherwise), so a new build is promoted only once it can actually
# serve. /api/healthz (DB-free liveness) stays available for plain up/down checks.
[services.production.health.startup]
path = "/api/readyz"
