kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.env]
PORT = "8080"

[services.development]
run = "python3 -m uvicorn api_pg:app --app-dir /home/runner/workspace --host 0.0.0.0 --port 8080"

[services.production]

[services.production.build]
args = ["python3", "--version"]

[services.production.run]
args = ["python3", "-m", "uvicorn", "api_pg:app", "--app-dir", "/home/runner/workspace", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/"
