kind = "data-app"
previewPath = "/"
title = "Vivo Fashion Group BI"
version = "1.0.0"
id = "artifacts/vivo-bi"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18659

[services.development]
run = "python3 ../../scripts/start_vivo_bi_managed.py"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vivo-bi", "run", "build" ]
publicDir = "artifacts/vivo-bi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18659"
BASE_PATH = "/"
