components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KpiSummary:
      type: object
      required:
        - totalRevenue
        - revenueGrowthPct
        - unitsSold
        - unitsGrowthPct
        - avgOrderValue
        - aovGrowthPct
        - grossMarginPct
        - marginChangePct
        - returnRatePct
        - returnRateChangePct
        - onlineSharePct
        - activeStores
      properties:
        totalRevenue:
          type: number
        revenueGrowthPct:
          type: number
        unitsSold:
          type: integer
        unitsGrowthPct:
          type: number
        avgOrderValue:
          type: number
        aovGrowthPct:
          type: number
        grossMarginPct:
          type: number
        marginChangePct:
          type: number
        returnRatePct:
          type: number
        returnRateChangePct:
          type: number
        onlineSharePct:
          type: number
        activeStores:
          type: integer
    RevenuePoint:
      type: object
      required:
        - month
        - currentYear
        - priorYear
      properties:
        month:
          type: string
        currentYear:
          type: number
        priorYear:
          type: number
    BrandSales:
      type: object
      required:
        - brand
        - revenue
        - units
        - marginPct
        - growthPct
      properties:
        brand:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
        growthPct:
          type: number
    CategorySales:
      type: object
      required:
        - category
        - revenue
        - units
        - marginPct
      properties:
        category:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
    RegionSales:
      type: object
      required:
        - region
        - revenue
        - units
        - growthPct
      properties:
        region:
          type: string
        revenue:
          type: number
        units:
          type: integer
        growthPct:
          type: number
    ChannelSales:
      type: object
      required:
        - channel
        - revenue
        - units
        - orders
      properties:
        channel:
          type: string
        revenue:
          type: number
        units:
          type: integer
        orders:
          type: integer
    ProductSales:
      type: object
      required:
        - sku
        - name
        - brand
        - category
        - revenue
        - units
        - marginPct
      properties:
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
    StorePerformance:
      type: object
      required:
        - store
        - region
        - revenue
        - units
        - targetPct
        - growthPct
      properties:
        store:
          type: string
        region:
          type: string
        revenue:
          type: number
        units:
          type: integer
        targetPct:
          type: number
        growthPct:
          type: number
    InventoryHealth:
      type: object
      required:
        - category
        - stockUnits
        - stockValue
        - weeksOfCover
        - sellThroughPct
      properties:
        category:
          type: string
        stockUnits:
          type: integer
        stockValue:
          type: number
        weeksOfCover:
          type: number
        sellThroughPct:
          type: number
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    WorkspaceUser:
      type: object
      required: [id, name, email, role, initials, color]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        initials: { type: string }
        color: { type: string }
    WorkspaceSession:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        user:
          $ref: "#/components/schemas/WorkspaceUser"
    WorkspaceTeamMember:
      type: object
      required: [id, name, role, department, team, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        department: { type: string }
        team: { type: string }
        dateOfBirth: { type: ["string", "null"], format: date }
        createdAt: { type: string }
    WorkspaceTeamMemberInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        department: { type: string }
        team: { type: string }
        dateOfBirth: { type: ["string", "null"], format: date }
    WorkspaceTeamDirectoryMember:
      type: object
      required: [id, name, roleTitle, teamSection, description, isLma, displayOrder]
      properties:
        id: { type: integer }
        name: { type: string }
        roleTitle: { type: string }
        teamSection: { type: string }
        description: { type: string }
        birthday: { type: ["string", "null"], format: date }
        photoUrl: { type: ["string", "null"] }
        isLma: { type: boolean }
        displayOrder: { type: integer }
        createdAt: { type: ["string", "null"] }
    WorkspaceTeamDirectoryMemberInput:
      type: object
      required: [roleTitle, teamSection]
      properties:
        name: { type: string }
        roleTitle: { type: string }
        teamSection: { type: string }
        description: { type: string }
        birthday: { type: ["string", "null"], format: date }
        photoPath: { type: ["string", "null"] }
        isLma: { type: boolean }
    WorkspaceTeamBirthday:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
    WorkspaceTeamDirectoryReorderInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, displayOrder]
            properties:
              id: { type: integer }
              displayOrder: { type: integer }
    WorkspacePhotoUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png] }
    WorkspacePhotoUploadResponse:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string }
    WorkspaceDashboard:
      type: object
      required: [snapshot, kpis, activity, pipeline, upcoming]
      properties:
        snapshot:
          $ref: "#/components/schemas/WorkspaceDashboardSnapshot"
        kpis:
          type: array
          items: { type: object, additionalProperties: true }
        activity:
          type: array
          items: { type: object, additionalProperties: true }
        pipeline:
          type: array
          items: { type: object, additionalProperties: true }
        upcoming:
          type: array
          items: { type: object, additionalProperties: true }
    WorkspaceDashboardSnapshot:
      type: object
      required: [asOfDate, planningPeriod, inDevelopment, dueThisWeek, atRisk, budgetUsedPercent, budgetUsedKes, budgetKesMillions, stages]
      properties:
        asOfDate: { type: string, format: date }
        planningPeriod: { type: string }
        inDevelopment: { type: integer }
        dueThisWeek: { type: integer }
        atRisk: { type: integer }
        budgetUsedPercent: { type: number, nullable: true }
        budgetUsedKes: { type: number, nullable: true }
        budgetKesMillions: { type: number, nullable: true }
        stages:
          type: array
          items:
            type: object
            required: [stage, count]
            properties:
              stage: { type: string }
              count: { type: integer }
    WorkspaceL10Meeting:
      type: object
      required: [id, weekLabel, meetingDate, startTime, endTime, location, durationMinutes, concluded, isCurrent]
      properties:
        id: { type: integer }
        weekLabel: { type: string }
        meetingDate: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
