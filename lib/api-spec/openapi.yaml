openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bi
    description: Business intelligence dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bi/summary:
    get:
      operationId: getKpiSummary
      tags: [bi]
      summary: Headline KPIs
      description: Top-level KPIs for the group across the trailing period.
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSummary"
  /bi/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [bi]
      summary: Monthly revenue trend
      description: Monthly net revenue for the current and prior year.
      responses:
        "200":
          description: Monthly revenue points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"
  /bi/sales-by-brand:
    get:
      operationId: getSalesByBrand
      tags: [bi]
      summary: Revenue by brand
      description: Net revenue and units grouped by brand in the group portfolio.
      responses:
        "200":
          description: Brand performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandSales"
  /bi/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [bi]
      summary: Revenue by product category
      responses:
        "200":
          description: Category performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySales"
  /bi/sales-by-region:
    get:
      operationId: getSalesByRegion
      tags: [bi]
      summary: Revenue by region
      responses:
        "200":
          description: Region performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionSales"
  /bi/sales-by-channel:
    get:
      operationId: getSalesByChannel
      tags: [bi]
      summary: Revenue by sales channel
      description: Net revenue split across online, retail, and wholesale channels.
      responses:
        "200":
          description: Channel performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSales"
  /bi/top-products:
    get:
      operationId: getTopProducts
      tags: [bi]
      summary: Top selling products
      responses:
        "200":
          description: Top product rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"
  /bi/store-performance:
    get:
      operationId: getStorePerformance
      tags: [bi]
      summary: Store level performance
      responses:
        "200":
          description: Store performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePerformance"
  /bi/inventory-health:
    get:
      operationId: getInventoryHealth
      tags: [bi]
      summary: Inventory health by category
      description: Stock value, units, and weeks of cover per category with sell-through.
      responses:
        "200":
          description: Inventory rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryHealth"
  /workspace/session:
    get:
      operationId: getWorkspaceSession
      tags: [workspace]
      summary: Current product workspace session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
  /workspace/login:
    post:
      operationId: loginWorkspace
      tags: [workspace]
      summary: Start a product workspace session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Invalid credentials
  /workspace/logout:
    post:
      operationId: logoutWorkspace
      tags: [workspace]
      summary: End the current product workspace session
      responses:
        "204":
          description: Session ended
  /workspace/dashboard:
    get:
      operationId: getWorkspaceDashboard
      tags: [workspace]
      summary: Product workspace dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDashboard"
  /workspace/styles:
    get:
      operationId: listWorkspaceStyles
      tags: [workspace]
      summary: List workspace styles
      parameters:
        - name: brand
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceStyle"
  /workspace/styles/{id}:
    get:
      operationId: getWorkspaceStyle
      tags: [workspace]
      summary: Get a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Style detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
    patch:
      operationId: updateWorkspaceStyle
      tags: [workspace]
      summary: Update a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdate"
      responses:
        "200":
          description: Updated style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/plm:
    get:
      operationId: getWorkspaceStylePlm
      tags: [workspace]
      summary: Get PLM workflow data for a style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PLM workflow data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/plan:
    get:
      operationId: getWorkspacePlan
      tags: [workspace]
      summary: Get a quarterly plan
      parameters:
        - name: quarter
          in: query
          schema:
            type: string
            pattern: "^Q[1-4]$"
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
    post:
      operationId: createWorkspacePlan
      tags: [workspace]
      summary: Create a quarterly plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "201":
          description: Created quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
    patch:
      operationId: updateWorkspacePlan
      tags: [workspace]
      summary: Update quarterly plan metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
  /workspace/plans:
    get:
      operationId: listWorkspacePlans
      tags: [workspace]
      summary: List quarterly plans with style counts
      responses:
        "200":
          description: Quarterly plan index
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspacePlanIndexItem"
  /workspace/plan/styles:
    post:
      operationId: addWorkspacePlanStyle
      tags: [workspace]
      summary: Add an existing or placeholder style to a quarterly plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanStyleInput"
      responses:
        "201":
          description: Updated quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
  /workspace/plan/history:
    get:
      operationId: listWorkspacePlanHistory
      tags: [workspace]
      summary: Plan change history
      responses:
        "200":
          description: Plan history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspacePlanHistory"
  /workspace/boards:
    get:
      operationId: listWorkspaceBoards
      tags: [workspace]
      summary: List collaboration boards
      responses:
        "200":
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceBoard"
    post:
      operationId: createWorkspaceBoard
      tags: [workspace]
      summary: Create a collaboration board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardInput"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoard"
  /workspace/boards/{id}:
    get:
      operationId: getWorkspaceBoard
      tags: [workspace]
      summary: Get a collaboration board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoard"
  /workspace/boards/{id}/cards:
    post:
      operationId: createWorkspaceBoardCard
      tags: [workspace]
      summary: Add a card to a board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardInput"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoardCard"
  /workspace/boards/{id}/comments:
    post:
      operationId: createWorkspaceBoardComment
      tags: [workspace]
      summary: Add a comment to a board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceComment"
  /workspace/boards/{id}/cards/{cardId}:
    patch:
      operationId: updateWorkspaceBoardCard
      tags: [workspace]
      summary: Move or update a board card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardUpdate"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoardCard"
  /workspace/showcases:
    get:
      operationId: listWorkspaceShowcases
      tags: [workspace]
      summary: List showcases
      responses:
        "200":
          description: Showcases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceShowcase"
  /workspace/showcases/{id}:
    get:
      operationId: getWorkspaceShowcase
      tags: [workspace]
      summary: Get a showcase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Showcase detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceShowcase"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KpiSummary:
      type: object
      required:
        - totalRevenue
        - revenueGrowthPct
        - unitsSold
        - unitsGrowthPct
        - avgOrderValue
        - aovGrowthPct
        - grossMarginPct
        - marginChangePct
        - returnRatePct
        - returnRateChangePct
        - onlineSharePct
        - activeStores
      properties:
        totalRevenue:
          type: number
        revenueGrowthPct:
          type: number
        unitsSold:
          type: integer
        unitsGrowthPct:
          type: number
        avgOrderValue:
          type: number
        aovGrowthPct:
          type: number
        grossMarginPct:
          type: number
        marginChangePct:
          type: number
        returnRatePct:
          type: number
        returnRateChangePct:
          type: number
        onlineSharePct:
          type: number
        activeStores:
          type: integer
    RevenuePoint:
      type: object
      required:
        - month
        - currentYear
        - priorYear
      properties:
        month:
          type: string
        currentYear:
          type: number
        priorYear:
          type: number
    BrandSales:
      type: object
      required:
        - brand
        - revenue
        - units
        - marginPct
        - growthPct
      properties:
        brand:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
        growthPct:
          type: number
    CategorySales:
      type: object
      required:
        - category
        - revenue
        - units
        - marginPct
      properties:
        category:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
    RegionSales:
      type: object
      required:
        - region
        - revenue
        - units
        - growthPct
      properties:
        region:
          type: string
        revenue:
          type: number
        units:
          type: integer
        growthPct:
          type: number
    ChannelSales:
      type: object
      required:
        - channel
        - revenue
        - units
        - orders
      properties:
        channel:
          type: string
        revenue:
          type: number
        units:
          type: integer
        orders:
          type: integer
    ProductSales:
      type: object
      required:
        - sku
        - name
        - brand
        - category
        - revenue
        - units
        - marginPct
      properties:
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        revenue:
          type: number
        units:
          type: integer
        marginPct:
          type: number
    StorePerformance:
      type: object
      required:
        - store
        - region
        - revenue
        - units
        - targetPct
        - growthPct
      properties:
        store:
          type: string
        region:
          type: string
        revenue:
          type: number
        units:
          type: integer
        targetPct:
          type: number
        growthPct:
          type: number
    InventoryHealth:
      type: object
      required:
        - category
        - stockUnits
        - stockValue
        - weeksOfCover
        - sellThroughPct
      properties:
        category:
          type: string
        stockUnits:
          type: integer
        stockValue:
          type: number
        weeksOfCover:
          type: number
        sellThroughPct:
          type: number
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    WorkspaceUser:
      type: object
      required: [id, name, email, role, initials, color]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        initials: { type: string }
        color: { type: string }
    WorkspaceSession:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        user:
          $ref: "#/components/schemas/WorkspaceUser"
    WorkspaceDashboard:
      type: object
      required: [kpis, activity, pipeline, upcoming]
      properties:
        kpis:
          type: array
          items: { type: object, additionalProperties: true }
        activity:
          type: array
          items: { type: object, additionalProperties: true }
        pipeline:
          type: array
          items: { type: object, additionalProperties: true }
        upcoming:
          type: array
          items: { type: object, additionalProperties: true }
    WorkspaceStyle:
      type: object
      required: [id, code, name, brand, category, status, owner, targetDate]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { type: string }
        status: { type: string }
        owner: { type: string }
        targetDate: { type: string }
        image: { type: ["string", "null"] }
        progress: { type: number }
        price: { type: number }
        market: { type: string }
    StyleUpdate:
      type: object
      properties:
        status: { type: string }
        owner: { type: string }
        targetDate: { type: string }
        progress: { type: number }
        price: { type: number }
        tier: { type: string }
    WorkspaceStyleDetail:
      allOf:
        - $ref: "#/components/schemas/WorkspaceStyle"
        - type: object
          required: [colorways, fabrics, techPack, fitSessions, gradings, boms, samples, pomQc, costEstimate, productionOrder]
          properties:
            colorways: { type: array, items: { type: object, additionalProperties: true } }
            fabrics: { type: array, items: { type: object, additionalProperties: true } }
            techPack: { type: object, additionalProperties: true }
            fitSessions: { type: array, items: { type: object, additionalProperties: true } }
            gradings: { type: array, items: { type: object, additionalProperties: true } }
            boms: { type: array, items: { type: object, additionalProperties: true } }
            samples: { type: array, items: { type: object, additionalProperties: true } }
            pomQc: { type: array, items: { type: object, additionalProperties: true } }
            costEstimate: { type: object, additionalProperties: true }
            productionOrder: { type: object, additionalProperties: true }
    WorkspacePlan:
      type: object
      required: [id, name, quarter, year, styles, summary]
      properties:
        id: { type: integer }
        name: { type: string }
        quarter: { type: string }
        year: { type: integer }
        styles: { type: array, items: { $ref: "#/components/schemas/WorkspaceStyle" } }
        summary: { type: object, additionalProperties: true }
    PlanUpdate:
      type: object
      properties:
        planId: { type: integer }
        name: { type: string }
        quarter: { type: string }
        year: { type: integer }
    PlanCreate:
      type: object
      required: [name, quarter, year]
      properties:
        name: { type: string, minLength: 1 }
        quarter: { type: string, pattern: "^Q[1-4]$" }
        year: { type: integer, minimum: 2020, maximum: 2100 }
    PlanStyleInput:
      type: object
      required: [planId]
      properties:
        planId: { type: integer }
        styleId: { type: integer }
        category: { type: string }
        tier: { type: string }
    WorkspacePlanIndexItem:
      type: object
      required: [id, name, quarter, year, styleCount, status]
      properties:
        id: { type: integer }
        name: { type: string }
        quarter: { type: string }
        year: { type: integer }
        styleCount: { type: integer }
        status: { type: string }
    WorkspacePlanHistory:
      type: object
      required: [id, planId, action, actor, createdAt]
      properties:
        id: { type: integer }
        planId: { type: integer }
        action: { type: string }
        actor: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    WorkspaceBoard:
      type: object
      required: [id, title, description, columns, cards, comments, collaborators]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        columns: { type: array, items: { type: object, additionalProperties: true } }
        cards: { type: array, items: { $ref: "#/components/schemas/WorkspaceBoardCard" } }
        comments: { type: array, items: { $ref: "#/components/schemas/WorkspaceComment" } }
        collaborators: { type: array, items: { $ref: "#/components/schemas/WorkspaceUser" } }
    BoardInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
    WorkspaceBoardCard:
      type: object
      required: [id, boardId, title, columnId, position]
      properties:
        id: { type: integer }
        boardId: { type: integer }
        title: { type: string }
        description: { type: string }
        columnId: { type: string }
        position: { type: integer }
        styleId: { type: ["integer", "null"] }
        tags: { type: array, items: { type: string } }
        assignees: { type: array, items: { type: object, additionalProperties: true } }
    BoardCardInput:
      type: object
      required: [title, columnId]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        columnId: { type: string }
        styleId: { type: integer }
        tags: { type: array, items: { type: string } }
    BoardCardUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        columnId: { type: string }
        position: { type: integer }
        tags: { type: array, items: { type: string } }
    WorkspaceComment:
      type: object
      required: [id, boardId, body, author, createdAt]
      properties:
        id: { type: integer }
        boardId: { type: integer }
        cardId: { type: ["integer", "null"] }
        body: { type: string }
        author: { $ref: "#/components/schemas/WorkspaceUser" }
        createdAt: { type: string }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
        cardId: { type: integer }
    WorkspaceShowcase:
      type: object
      required: [id, title, season, status, frames]
      properties:
        id: { type: integer }
        title: { type: string }
        season: { type: string }
        status: { type: string }
        description: { type: string }
        frames: { type: array, items: { type: object, additionalProperties: true } }
