openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bi
    description: Business intelligence dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bi/summary:
    get:
      operationId: getKpiSummary
      tags: [bi]
      summary: Headline KPIs
      description: Top-level KPIs for the group across the trailing period.
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSummary"
  /bi/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [bi]
      summary: Monthly revenue trend
      description: Monthly net revenue for the current and prior year.
      responses:
        "200":
          description: Monthly revenue points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"
  /bi/sales-by-brand:
    get:
      operationId: getSalesByBrand
      tags: [bi]
      summary: Revenue by brand
      description: Net revenue and units grouped by brand in the group portfolio.
      responses:
        "200":
          description: Brand performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandSales"
  /bi/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [bi]
      summary: Revenue by product category
      responses:
        "200":
          description: Category performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySales"
  /bi/sales-by-region:
    get:
      operationId: getSalesByRegion
      tags: [bi]
      summary: Revenue by region
      responses:
        "200":
          description: Region performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionSales"
  /bi/sales-by-channel:
    get:
      operationId: getSalesByChannel
      tags: [bi]
      summary: Revenue by sales channel
      description: Net revenue split across online, retail, and wholesale channels.
      responses:
        "200":
          description: Channel performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSales"
  /bi/top-products:
    get:
      operationId: getTopProducts
      tags: [bi]
      summary: Top selling products
      responses:
        "200":
          description: Top product rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"
  /bi/store-performance:
    get:
      operationId: getStorePerformance
      tags: [bi]
      summary: Store level performance
      responses:
        "200":
          description: Store performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePerformance"
  /bi/inventory-health:
    get:
      operationId: getInventoryHealth
      tags: [bi]
      summary: Inventory health by category
      description: Stock value, units, and weeks of cover per category with sell-through.
      responses:
        "200":
          description: Inventory rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryHealth"
  /workspace/session:
    get:
      operationId: getWorkspaceSession
      tags: [workspace]
      summary: Current product workspace session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
  /workspace/login:
    post:
      operationId: loginWorkspace
      tags: [workspace]
      summary: Start a product workspace session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Invalid credentials
  /workspace/logout:
    post:
      operationId: logoutWorkspace
      tags: [workspace]
      summary: End the current product workspace session
      responses:
        "204":
          description: Session ended
  /workspace/team:
    get:
      operationId: listWorkspaceTeam
      tags: [workspace]
      summary: List workspace team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTeamMember"
    post:
      operationId: createWorkspaceTeamMember
      tags: [workspace]
      summary: Add a workspace team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamMemberInput"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamMember"
        "400":
          description: Invalid input
  /workspace/team/{id}:
    put:
      operationId: updateWorkspaceTeamMember
      tags: [workspace]
      summary: Update a workspace team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamMemberInput"
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamMember"
        "404":
          description: Team member not found
    delete:
      operationId: deleteWorkspaceTeamMember
      tags: [workspace]
      summary: Remove a workspace team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Team member removed
        "404":
          description: Team member not found
  /workspace/team-directory:
    get:
      operationId: listWorkspaceTeamDirectory
      tags: [workspace]
      summary: List Product Department team directory members
      responses:
        "200":
          description: Team directory members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTeamDirectoryMember"
    post:
      operationId: createWorkspaceTeamDirectoryMember
      tags: [workspace]
      summary: Add a Product Department directory member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamDirectoryMemberInput"
      responses:
        "201":
          description: Created directory member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamDirectoryMember"
        "403":
          description: Admin access required
  /team/birthdays/today:
    get:
      operationId: listTodayTeamBirthdays
      tags: [workspace]
      summary: List Product Department birthdays for today
      responses:
        "200":
          description: Team members with birthdays today
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTeamBirthday"
        "401":
          description: Sign in required
  /workspace/team-directory/{id}:
    patch:
      operationId: updateWorkspaceTeamDirectoryMember
      tags: [workspace]
      summary: Update a Product Department directory member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamDirectoryMemberInput"
      responses:
        "200":
          description: Updated directory member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamDirectoryMember"
        "403":
          description: Admin access required
        "404":
          description: Directory member not found
  /workspace/team-directory/reorder:
    put:
      operationId: reorderWorkspaceTeamDirectory
      tags: [workspace]
      summary: Reorder directory members within their sections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamDirectoryReorderInput"
      responses:
        "204":
          description: Directory order saved
        "403":
          description: Admin access required
  /workspace/team-directory/upload-url:
    post:
      operationId: requestWorkspaceTeamDirectoryPhotoUpload
      tags: [workspace]
      summary: Request a direct upload URL for a directory photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePhotoUploadInput"
      responses:
        "200":
          description: Direct upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePhotoUploadResponse"
        "403":
          description: Admin access required
  /workspace/team-directory/{id}/photo:
    get:
      operationId: getWorkspaceTeamDirectoryPhoto
      tags: [workspace]
      summary: Serve a directory profile photo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Profile photo
          content:
            image/jpeg: {}
            image/png: {}
        "404":
          description: Photo not found
  /workspace/dashboard:
    get:
      operationId: getWorkspaceDashboard
      tags: [workspace]
      summary: Product workspace dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDashboard"
  /workspace/l10/meetings:
    get:
      operationId: listWorkspaceL10Meetings
      tags: [workspace]
      summary: List Product Workspace EOS Level 10 meetings
      responses:
        "200":
          description: L10 meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceL10Meeting"
  /workspace/l10/meetings/{meetingId}:
    get:
      operationId: getWorkspaceL10Meeting
      tags: [workspace]
      summary: Get a complete L10 meeting
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: L10 meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10MeetingDetail"
        "404":
          description: Meeting not found
  /workspace/l10/meetings/{meetingId}/checkins:
    put:
      operationId: updateWorkspaceL10Checkins
      tags: [workspace]
      summary: Save L10 check-in rows
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10CheckinsInput"
      responses:
        "200":
          description: Check-ins saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationResult"
  /workspace/l10/meetings/{meetingId}/scorecard/{metricId}:
    put:
      operationId: updateWorkspaceL10ScorecardEntry
      tags: [workspace]
      summary: Save an L10 scorecard value and status
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
        - name: metricId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10ScorecardEntryInput"
      responses:
        "200":
          description: Scorecard entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10ScorecardEntry"
  /workspace/l10/rocks/{rockId}:
    put:
      operationId: updateWorkspaceL10Rock
      tags: [workspace]
      summary: Update an L10 rock status
      parameters:
        - name: rockId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10RockStatusInput"
      responses:
        "200":
          description: Rock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10Rock"
  /workspace/l10/meetings/{meetingId}/notes:
    put:
      operationId: updateWorkspaceL10AgendaNotes
      tags: [workspace]
      summary: Save L10 headlines, to-dos, IDS, and conclusion notes
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10AgendaNotes"
      responses:
        "200":
          description: Agenda notes saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10AgendaNotes"
  /workspace/l10/meetings/{meetingId}/headlines:
    put:
      operationId: updateWorkspaceL10Headlines
      tags: [workspace]
      summary: Save L10 customer and employee headlines
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10HeadlinesInput"
      responses:
        "200":
          description: Headlines saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationResult"
  /workspace/l10/meetings/{meetingId}/todos:
    put:
      operationId: updateWorkspaceL10Todos
      tags: [workspace]
      summary: Save L10 to-dos
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10TodosInput"
      responses:
        "200":
          description: To-dos saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationResult"
  /workspace/l10/meetings/{meetingId}/issues/reorder:
    put:
      operationId: reorderWorkspaceL10Issues
      tags: [workspace]
      summary: Reorder active L10 issues
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10IssuesInput"
      responses:
        "200":
          description: Issues reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationResult"
  /workspace/l10/meetings/{meetingId}/issues:
    post:
      operationId: createWorkspaceL10Issue
      tags: [workspace]
      summary: Create an L10 issue
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10IssueInput"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10Issue"
  /workspace/l10/issues/{issueId}:
    put:
      operationId: updateWorkspaceL10Issue
      tags: [workspace]
      summary: Move an L10 issue to parking or resolved
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10IssueActionInput"
      responses:
        "200":
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10Issue"
  /workspace/l10/issues/{issueId}/todo:
    post:
      operationId: createWorkspaceL10TodoFromIssue
      tags: [workspace]
      summary: Create a linked to-do from an L10 issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Linked to-do created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10Todo"
  /workspace/l10/meetings/{meetingId}/ratings:
    put:
      operationId: updateWorkspaceL10Ratings
      tags: [workspace]
      summary: Save L10 meeting ratings
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10RatingsInput"
      responses:
        "200":
          description: Ratings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMutationResult"
  /workspace/l10/meetings/{meetingId}/cascading-message:
    put:
      operationId: updateWorkspaceL10CascadingMessage
      tags: [workspace]
      summary: Save the L10 cascading message
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceL10CascadingMessageInput"
      responses:
        "200":
          description: Cascading message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10CascadingMessage"
  /workspace/l10/meetings/{meetingId}/end:
    post:
      operationId: endWorkspaceL10Meeting
      tags: [workspace]
      summary: Conclude an L10 meeting and make it read-only
      parameters:
        - name: meetingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Meeting concluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceL10Meeting"
  /workspace/styles:
    get:
      operationId: listWorkspaceStyles
      tags: [workspace]
      summary: List workspace styles
      parameters:
        - name: brand
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: source
          in: query
          description: Use the Product Development pd_styles source for the PLM board.
          schema:
            type: string
            enum: [pd]
        - name: season
          in: query
          description: Filter Product Development styles by quarter.
          schema:
            type: string
      responses:
        "200":
          description: Styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceStyle"
    post:
      operationId: createWorkspaceStyle
      tags: [workspace]
      summary: Create a style in the PLM pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleCreate"
      responses:
        "201":
          description: Created style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/plm/meta:
    get:
      operationId: getWorkspacePlmMeta
      tags: [workspace]
      summary: PLM user, fabric, and category pickers
      responses:
        "200":
          description: PLM metadata
          content:
            application/json:
              schema:
                 $ref: "#/components/schemas/WorkspacePlmMeta"
  /workspace/range-plan:
    get:
      operationId: getWorkspaceRangePlan
      tags: [workspace]
      summary: Get the season-driven assortment and editable range plan
      parameters:
        - name: seasonId
          in: query
          schema: { type: integer }
        - name: quarter
          in: query
          schema:
            type: string
            enum: ["Q3 2026", "Q4 2026"]
      responses:
        "200":
          description: Range plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRangePlan"
  /workspace/range-plan/styles/{id}/season:
    patch:
      operationId: moveWorkspaceStyleSeason
      tags: [workspace]
      summary: Move a Product Development style to a quarter
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSeasonMove"
      responses:
        "200":
          description: Updated season
  /workspace/range-plan/styles/bulk-season:
    post:
      operationId: bulkMoveWorkspaceStyleSeason
      tags: [workspace]
      summary: Move multiple Product Development styles to a quarter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBulkSeasonMove"
      responses:
        "200":
          description: Number of styles updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
  /workspace/range-plan/exclusions:
    put:
      operationId: updateWorkspaceAssortmentExclusion
      tags: [workspace]
      summary: Include or exclude a carry-over catalogue style for a quarter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAssortmentExclusionInput"
      responses:
        "200":
          description: Updated assortment exclusion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssortmentExclusion"
  /workspace/styles/{id}:
    get:
      operationId: getWorkspaceStyle
      tags: [workspace]
      summary: Get a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Style detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
    patch:
      operationId: updateWorkspaceStyle
      tags: [workspace]
      summary: Update a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdate"
      responses:
        "200":
          description: Updated style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/transition:
    post:
      operationId: transitionWorkspaceStyle
      tags: [workspace]
      summary: Move a style through the PLM pipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleTransition"
      responses:
        "200":
          description: Transitioned style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/colorways:
    post:
      operationId: createWorkspaceColorway
      tags: [workspace]
      summary: Add a colourway to a style
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorwayInput"
      responses:
        "201":
          description: Updated style with the new colourway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/colorways/{colorwayId}:
    patch:
      operationId: updateWorkspaceColorway
      tags: [workspace]
      summary: Update a style colourway
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: colorwayId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorwayUpdate"
      responses:
        "200":
          description: Updated style with the changed colourway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/tech-pack:
    put:
      operationId: updateWorkspaceStyleTechPack
