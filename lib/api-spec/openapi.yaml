openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bi
    description: Business intelligence dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bi/summary:
    get:
      operationId: getKpiSummary
      tags: [bi]
      summary: Headline KPIs
      description: Top-level KPIs for the group across the trailing period.
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSummary"
  /bi/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [bi]
      summary: Monthly revenue trend
      description: Monthly net revenue for the current and prior year.
      responses:
        "200":
          description: Monthly revenue points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"
  /bi/sales-by-brand:
    get:
      operationId: getSalesByBrand
      tags: [bi]
      summary: Revenue by brand
      description: Net revenue and units grouped by brand in the group portfolio.
      responses:
        "200":
          description: Brand performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandSales"
  /bi/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [bi]
      summary: Revenue by product category
      responses:
        "200":
          description: Category performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySales"
  /bi/sales-by-region:
    get:
      operationId: getSalesByRegion
      tags: [bi]
      summary: Revenue by region
      responses:
        "200":
          description: Region performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionSales"
  /bi/sales-by-channel:
    get:
      operationId: getSalesByChannel
      tags: [bi]
      summary: Revenue by sales channel
      description: Net revenue split across online, retail, and wholesale channels.
      responses:
        "200":
          description: Channel performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelSales"
  /bi/top-products:
    get:
      operationId: getTopProducts
      tags: [bi]
      summary: Top selling products
      responses:
        "200":
          description: Top product rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"
  /bi/store-performance:
    get:
      operationId: getStorePerformance
      tags: [bi]
      summary: Store level performance
      responses:
        "200":
          description: Store performance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePerformance"
  /bi/inventory-health:
    get:
      operationId: getInventoryHealth
      tags: [bi]
      summary: Inventory health by category
      description: Stock value, units, and weeks of cover per category with sell-through.
      responses:
        "200":
          description: Inventory rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryHealth"
  /workspace/session:
    get:
      operationId: getWorkspaceSession
      tags: [workspace]
      summary: Current product workspace session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
  /workspace/login:
    post:
      operationId: loginWorkspace
      tags: [workspace]
      summary: Start a product workspace session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Invalid credentials
  /workspace/logout:
    post:
      operationId: logoutWorkspace
      tags: [workspace]
      summary: End the current product workspace session
      responses:
        "204":
          description: Session ended
  /workspace/team:
    get:
      operationId: listWorkspaceTeam
      tags: [workspace]
      summary: List workspace team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceTeamMember"
    post:
      operationId: createWorkspaceTeamMember
      tags: [workspace]
      summary: Add a workspace team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamMemberInput"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamMember"
        "400":
          description: Invalid input
  /workspace/team/{id}:
    put:
      operationId: updateWorkspaceTeamMember
      tags: [workspace]
      summary: Update a workspace team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTeamMemberInput"
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTeamMember"
        "404":
          description: Team member not found
    delete:
      operationId: deleteWorkspaceTeamMember
      tags: [workspace]
      summary: Remove a workspace team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Team member removed
        "404":
          description: Team member not found
  /workspace/dashboard:
    get:
      operationId: getWorkspaceDashboard
      tags: [workspace]
      summary: Product workspace dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDashboard"
  /workspace/styles:
    get:
      operationId: listWorkspaceStyles
      tags: [workspace]
      summary: List workspace styles
      parameters:
        - name: brand
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceStyle"
    post:
      operationId: createWorkspaceStyle
      tags: [workspace]
      summary: Create a style in the PLM pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleCreate"
      responses:
        "201":
          description: Created style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/plm/meta:
    get:
      operationId: getWorkspacePlmMeta
      tags: [workspace]
      summary: PLM user, fabric, and category pickers
      responses:
        "200":
          description: PLM metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlmMeta"
  /workspace/styles/{id}:
    get:
      operationId: getWorkspaceStyle
      tags: [workspace]
      summary: Get a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Style detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/transition:
    post:
      operationId: transitionWorkspaceStyle
      tags: [workspace]
      summary: Move a style through the PLM pipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleTransition"
      responses:
        "200":
          description: Transitioned style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/tech-pack:
    put:
      operationId: updateWorkspaceStyleTechPack
      tags: [workspace]
      summary: Save style tech pack and pattern details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechPackUpdate"
      responses:
        "200":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/fit-sessions:
    post:
      operationId: createWorkspaceFitSession
      tags: [workspace]
      summary: Add a style fit session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FitSessionInput"
      responses:
        "201":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/grading:
    put:
      operationId: updateWorkspaceStyleGrading
      tags: [workspace]
      summary: Save style grading details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradingUpdate"
      responses:
        "200":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/samples:
    post:
      operationId: createWorkspaceSample
      tags: [workspace]
      summary: Add a sample development record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleDevelopmentInput"
      responses:
        "201":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/cost-estimate:
    put:
      operationId: updateWorkspaceCostEstimate
      tags: [workspace]
      summary: Save style cost estimate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostEstimateUpdate"
      responses:
        "200":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/pom-qc:
    put:
      operationId: updateWorkspacePomQc
      tags: [workspace]
      summary: Save style POM quality checks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PomQcInput"
      responses:
        "200":
          description: Updated PLM style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
    patch:
      operationId: updateWorkspaceStyle
      tags: [workspace]
      summary: Update a workspace style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdate"
      responses:
        "200":
          description: Updated style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/styles/{id}/plm:
    get:
      operationId: getWorkspaceStylePlm
      tags: [workspace]
      summary: Get PLM workflow data for a style
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PLM workflow data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStyleDetail"
  /workspace/plan:
    get:
      operationId: getWorkspacePlan
      tags: [workspace]
      summary: Get a quarterly plan
      parameters:
        - name: quarter
          in: query
          schema:
            type: string
            pattern: "^Q[1-4]$"
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
    post:
      operationId: createWorkspacePlan
      tags: [workspace]
      summary: Create a quarterly plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "201":
          description: Created quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
    patch:
      operationId: updateWorkspacePlan
      tags: [workspace]
      summary: Update quarterly plan metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
  /workspace/plans:
    get:
      operationId: listWorkspacePlans
      tags: [workspace]
      summary: List quarterly plans with style counts
      responses:
        "200":
          description: Quarterly plan index
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspacePlanIndexItem"
  /workspace/plan/styles:
    post:
      operationId: addWorkspacePlanStyle
      tags: [workspace]
      summary: Add an existing or placeholder style to a quarterly plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanStyleInput"
      responses:
        "201":
          description: Updated quarterly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlan"
  /workspace/plan/history:
    get:
      operationId: listWorkspacePlanHistory
      tags: [workspace]
      summary: Plan change history
      responses:
        "200":
          description: Plan history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspacePlanHistory"
  /workspace/boards:
    get:
      operationId: listWorkspaceBoards
      tags: [workspace]
      summary: List collaboration boards
      responses:
        "200":
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceBoard"
    post:
      operationId: createWorkspaceBoard
      tags: [workspace]
      summary: Create a collaboration board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardInput"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoard"
  /workspace/boards/{id}:
    get:
      operationId: getWorkspaceBoard
      tags: [workspace]
      summary: Get a collaboration board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoard"
  /workspace/boards/{id}/cards:
    post:
      operationId: createWorkspaceBoardCard
      tags: [workspace]
      summary: Add a card to a board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardInput"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoardCard"
  /workspace/boards/{id}/comments:
    post:
      operationId: createWorkspaceBoardComment
      tags: [workspace]
      summary: Add a comment to a board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceComment"
  /workspace/boards/{id}/cards/{cardId}:
    patch:
      operationId: updateWorkspaceBoardCard
      tags: [workspace]
      summary: Move or update a board card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardUpdate"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBoardCard"
  /workspace/showcases:
    get:
      operationId: listWorkspaceShowcases
      tags: [workspace]
      summary: List showcases
      responses:
        "200":
          description: Showcases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceShowcase"
  /workspace/showcases/{id}:
    get:
      operationId: getWorkspaceShowcase
      tags: [workspace]
      summary: Get a showcase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Showcase detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceShowcase"
  /workspace/catalogue-products:
    get:
      operationId: listCatalogueProducts
      tags: [workspace]
      summary: Paginated full catalogue (Odoo mirror, active + retired styles)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: brand
          in: query
          schema: { type: string }
        - name: subcategory
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, retired] }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Catalogue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePage"
  /workspace/showcase-boards:
    get:
      operationId: listShowcaseBoards
      tags: [workspace]
      summary: List showcase boards
      responses:
        "200":
          description: Showcase boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowcaseBoardSummary"
    post:
      operationId: createShowcaseBoard
      tags: [workspace]
      summary: Create a showcase board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseBoardCreate"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseBoardSummary"
        "400":
          description: Invalid input
  /workspace/showcase-boards/{id}:
    get:
      operationId: getShowcaseBoard
      tags: [workspace]
      summary: Get a showcase board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseBoard"
        "404":
          description: Board not found
    put:
      operationId: updateShowcaseBoard
      tags: [workspace]
      summary: Update a showcase board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseBoardUpdate"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseBoard"
        "404":
          description: Board not found
    delete:
      operationId: deleteShowcaseBoard
      tags: [workspace]
      summary: Delete a showcase board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Board deleted
        "404":
          description: Board not found
  /workspace/showcase-boards/{id}/sections:
    post:
      operationId: createShowcaseSection
      tags: [workspace]
      summary: Add a section to a showcase board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseSectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseSection"
        "404":
          description: Board not found
  /workspace/showcase-sections/{id}:
    put:
      operationId: updateShowcaseSection
      tags: [workspace]
      summary: Update a showcase section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseSectionInput"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseSection"
        "404":
          description: Section not found
    delete:
      operationId: deleteShowcaseSection
      tags: [workspace]
      summary: Delete a showcase section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Section deleted
        "404":
          description: Section not found
  /workspace/showcase-sections/{id}/images:
    post:
      operationId: addShowcaseImages
      tags: [workspace]
      summary: Add images to a showcase section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseImagesInput"
      responses:
        "201":
          description: Created images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowcaseImage"
        "400":
          description: Invalid input
        "404":
          description: Section not found
  /workspace/showcase-images/{id}:
    delete:
      operationId: deleteShowcaseImage
      tags: [workspace]
      summary: Delete a showcase image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Image deleted
        "404":
          description: Image not found
  /workspace/showcase-boards/{id}/comments:
    post:
      operationId: createShowcaseComment
      tags: [workspace]
      summary: Comment on a showcase board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseComment"
        "400":
          description: Invalid input
        "404":
          description: Board not found
